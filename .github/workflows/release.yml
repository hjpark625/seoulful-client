name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '재배포할 정식 GitHub Release 태그 (예: v0.3.9)'
        required: true
        type: string

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('validate-pr-{0}', github.event.pull_request.number) || 'release-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate client and release configuration
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck:infra
      - run: pnpm changeset status
      - name: Resolve checked commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  resolve:
    needs: validate
    if: github.event_name != 'pull_request' && (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      url: ${{ steps.release.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create or update Changesets release PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version:release
          commit-message: 'chore: 릴리스 버전 및 변경 이력 갱신'
          pr-title: 'chore: 릴리스 버전 및 변경 이력 갱신'
          create-github-releases: false

      - name: Resolve versioned GitHub Release
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          HAS_CHANGESETS: ${{ steps.changesets.outputs.has-changesets }}
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            const { readFileSync, existsSync } = require('node:fs')
            const mainPush = context.eventName === 'push' && context.ref === 'refs/heads/main'
            core.setOutput('deploy', 'false')
            if (mainPush && process.env.HAS_CHANGESETS === 'true') {
              core.info('Changesets release PR is ready; merge it to release the version.')
              return
            }

            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
            const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
            const tag = mainPush ? `v${version}` : process.env.RELEASE_TAG
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected vX.Y.Z tag')
            const lines = existsSync('CHANGELOG.md') ? readFileSync('CHANGELOG.md', 'utf8').split('\n') : []
            const heading = lines.findIndex(line => line.trim() === `## ${version}`)
            if (mainPush && heading === -1) {
              core.info('No versioned changelog entry; no release is needed.')
              return
            }
            const nextHeading = lines.findIndex((line, index) => index > heading && line.startsWith('## '))
            const notes = heading === -1 ? '' : lines.slice(heading + 1, nextHeading === -1 ? undefined : nextHeading).join('\n').trim()
            const existingTag = execFileSync('git', ['tag', '--list', tag], { encoding: 'utf8' }).trim()
            if (existingTag) {
              const taggedSha = execFileSync('git', ['rev-parse', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' }).trim()
              if (taggedSha !== sha) {
                if (mainPush) {
                  core.info(`${tag} already belongs to an earlier release; no version bump to deploy.`)
                  return
                }
                throw new Error(`${tag} does not match the checked commit`)
              }
            }

            let release
            try {
              const response = await github.rest.repos.getReleaseByTag({ ...context.repo, tag })
              release = response.data
            } catch (error) {
              if (error.status !== 404 || context.eventName !== 'push') throw error
              const response = await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: sha,
                ...(notes ? { body: notes } : { generate_release_notes: true }),
              })
              release = response.data
            }
            if (release.draft || release.prerelease) throw new Error('A published stable release is required')
            // Continue in this run: GITHUB_TOKEN-created tags/releases do not trigger another workflow.
            core.setOutput('deploy', 'true')
            core.setOutput('tag', tag)
            core.setOutput('sha', sha)
            core.setOutput('url', release.html_url)

  deploy:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    name: Deploy release to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://seoulful.hjpark625.site
    permissions:
      contents: write
      deployments: write
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SEOULFUL_RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RAILWAY_PROJECT_ID: 1a68e725-e7be-485d-bf7d-47e92e738393
      RAILWAY_ENVIRONMENT_ID: 9933c911-806a-48db-8b98-1c14db885db1
      RAILWAY_SERVICE_ID: c7c61284-d740-4e85-989a-4f572cd8206a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Record deployment for release commit
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              ...context.repo, ref: process.env.SEOULFUL_RELEASE_SHA,
              environment: 'production', auto_merge: false, required_contexts: [],
              description: `Railway release ${process.env.RELEASE_TAG}`,
              payload: { tag: process.env.RELEASE_TAG },
            })
            core.setOutput('id', data.id)
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: data.id, state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check Railway credentials
        run: test -n "$RAILWAY_TOKEN" || { echo 'Configure the production Railway project token as RAILWAY_TOKEN'; exit 1; }

      - name: Preview release infrastructure
        run: pnpm railway:plan --environment "$RAILWAY_ENVIRONMENT_ID" --out /tmp/railway-plan.json

      - name: Apply release plan
        run: pnpm railway:apply --environment "$RAILWAY_ENVIRONMENT_ID" --plan /tmp/railway-plan.json --yes

      - name: Pin and deploy release commit
        id: railway
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process')

            const sha = process.env.SEOULFUL_RELEASE_SHA
            const environmentId = process.env.RAILWAY_ENVIRONMENT_ID
            const serviceId = process.env.RAILWAY_SERVICE_ID
            if (!sha || !/^[a-f0-9]{40}$/.test(sha) || !environmentId || !serviceId) {
              throw new Error('Release SHA, Railway environment and service are required')
            }

            // IaC ignores commitSha-only differences. Explicitly pin every release,
            // including rollbacks and retries, instead of accidentally following main.
            const query = `mutation Release($environmentId: String!, $serviceId: String!, $sha: String!, $patch: EnvironmentConfig!, $message: String!) {
              environmentPatchCommit(environmentId: $environmentId, patch: $patch, commitMessage: $message, skipDeploys: true)
              serviceInstanceDeployV2(environmentId: $environmentId, serviceId: $serviceId, commitSha: $sha)
            }`
            const variables = {
              environmentId,
              serviceId,
              sha,
              message: `Release ${process.env.RELEASE_TAG} (${sha})`,
              patch: {
                services: {
                  [serviceId]: {
                    source: {
                      repo: 'hjpark625/seoulful-client',
                      branch: 'main',
                      image: null,
                      autoUpdates: null,
                      commitSha: sha,
                    },
                  },
                },
              },
            }
            const response = JSON.parse(
              execFileSync('pnpm', ['exec', 'railway', 'api', query, '--variables', '@-', '--compact'], {
                input: JSON.stringify(variables),
                encoding: 'utf8',
                timeout: 60_000,
              }),
            )
            if (response.errors?.length || !response.data?.serviceInstanceDeployV2) {
              throw new Error(`Railway release failed: ${JSON.stringify(response.errors || response)}`)
            }
            console.log(`Railway release patch: ${response.data.environmentPatchCommit}`)
            console.log(`Railway deployment: ${response.data.serviceInstanceDeployV2}`)
            core.setOutput('deployment_id', response.data.serviceInstanceDeployV2)

      - name: Wait for Railway deployment
        env:
          RAILWAY_DEPLOYMENT_ID: ${{ steps.railway.outputs.deployment_id }}
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            const { writeFileSync } = require('node:fs')
            const { join } = require('node:path')
            const { setTimeout } = require('node:timers/promises')

            const sha = process.env.SEOULFUL_RELEASE_SHA
            const deploymentId = process.env.RAILWAY_DEPLOYMENT_ID
            if (!sha || !/^[a-f0-9]{40}$/.test(sha)) throw new Error('A release commit SHA is required')
            if (!deploymentId) throw new Error('The release deployment ID is required')

            const deadline = Date.now() + 20 * 60 * 1000
            while (Date.now() < deadline) {
              const deployments = JSON.parse(
                execFileSync(
                  'pnpm',
                  [
                    'exec',
                    'railway',
                    'deployment',
                    'list',
                    '--project',
                    process.env.RAILWAY_PROJECT_ID,
                    '--environment',
                    process.env.RAILWAY_ENVIRONMENT_ID,
                    '--service',
                    process.env.RAILWAY_SERVICE_ID,
                    '--limit',
                    '20',
                    '--json',
                  ],
                  { encoding: 'utf8', timeout: 30_000 },
                ),
              )
              const deployment = deployments.find((item) => item.id === deploymentId)
              if (deployment?.meta?.commitHash && deployment.meta.commitHash !== sha) {
                throw new Error(`Deployment ${deploymentId} has an unexpected commit`)
              }
              console.log(`Release ${sha}: ${deployment?.status || 'waiting for deployment'}`)
              if (deployment?.status === 'SUCCESS') {
                const receipt = {
                  tag: process.env.RELEASE_TAG,
                  commit: sha,
                  railwayDeploymentId: deployment.id,
                  status: deployment.status,
                  createdAt: deployment.createdAt,
                  verifiedAt: new Date().toISOString(),
                  workflowRun: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                }
                writeFileSync(
                  join(
                    process.env.RUNNER_TEMP,
                    `railway-deployment-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}.json`,
                  ),
                  JSON.stringify(receipt, null, 2) + '\n',
                )
                return
              }
              if (['FAILED', 'CRASHED', 'REMOVED', 'SKIPPED'].includes(deployment?.status)) {
                throw new Error(`Railway deployment ${deployment.id}: ${deployment.status}`)
              }
              await setTimeout(10_000)
            }
            throw new Error(`Timed out waiting for Railway deployment of ${sha}`)

      - name: Attach deployment receipt to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/railway-deployment-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"

      - name: Record deployment result
        if: always() && steps.deployment.outputs.id
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_URL: ${{ needs.resolve.outputs.url }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure'
            const logUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: Number(process.env.DEPLOYMENT_ID), state,
              environment_url: 'https://seoulful.hjpark625.site', log_url: logUrl,
              description: `${process.env.RELEASE_TAG}: ${state}`,
            })
            await core.summary.addHeading(`Release ${process.env.RELEASE_TAG}`)
              .addLink('GitHub Release', process.env.RELEASE_URL)
              .addTable([
                [{ data: 'Commit', header: true }, { data: 'Result', header: true }],
                [process.env.SEOULFUL_RELEASE_SHA, state],
              ]).write()
